name = "ai-worker-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-15"

# React studio frontend (built from web/, served by the Worker)
[assets]
directory = "web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Cloudflare AI binding (optional)
[ai]
binding = "AI"

# Admin dashboard data: model routes override + client API keys
[[kv_namespaces]]
binding = "ADMIN_KV"
id = "36c99f9286a94318916afca4281716eb"

# Request metrics history for the analytics dashboard
[[vectorize]]
binding = "VECTORIZE"
index_name = "bkg-rag"

[[d1_databases]]
binding = "DB"
database_name = "blg-metrics"
database_id = "c2a37613-0407-40eb-8d59-85400c76ce97"

# Cloudflare dashboard logs (optional)
[observability]
enabled = false
head_sampling_rate = 1

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

# ====================================================================================
# ROUTING
# ====================================================================================
# Model routing lives in routes.json and is bundled into the Worker script, so it is
# not limited to the 5.1 kB Cloudflare allows for a text binding. The file committed
# here is only an example: the deploy workflow overwrites it with the contents of the
# ROUTES_CONFIG (plus ROUTES_CONFIG_2 ... _9) repository variables before deploying.
#
# A ROUTES_CONFIG var/secret on the Worker itself is still honoured at runtime as an
# override. Do NOT add it to a [vars] block here — it would silently shadow routes.json.
#
# Secrets to set in the Cloudflare Dashboard (or with `wrangler secret put`):
# - PROXY_AUTH_TOKEN
# - every key name referenced by `apiKeys` in routes.json
#   (GOOGLE_KEY_1, NVIDIA_KEY_1, OPENROUTER_KEY_1, ANTHROPIC_KEY_1, ...)
# ====================================================================================

# Automatische Modell-Entdeckung: einmal am Tag neue Modelle pruefen
[triggers]
crons = ["17 5 * * *"]
